<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Host Harness (not production)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0f16; color: #e8edf4; font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: minmax(300px, 420px) 1fr; height: 100vh; }
    aside { padding: 14px; overflow: auto; border-right: 1px solid #26344a; }
    h1 { font-size: 15px; margin: 0 0 4px; } p.note { color: #a6b3c4; margin: 0 0 12px; font-size: 12px; }
    fieldset { border: 1px solid #26344a; border-radius: 8px; margin: 0 0 10px; padding: 8px 10px; }
    legend { color: #a6b3c4; font-size: 12px; }
    button, select { min-height: 36px; margin: 3px 3px 3px 0; background: #1a2635; color: #e8edf4; border: 1px solid #36506f; border-radius: 6px; padding: 0 10px; font: inherit; }
    #log { font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; background: #0f1621; border-radius: 6px; padding: 8px; max-height: 40vh; overflow: auto; }
    main { display: flex; align-items: center; justify-content: center; }
    iframe { border: 0; width: 390px; height: 844px; max-height: 96vh; background: #000; }
  </style>
</head>
<body>
  <aside>
    <h1>Demo host harness</h1>
    <p class="note">Local QA page. Fictional brands only. Demo credits have no cash value. Not an operator integration.</p>
    <fieldset><legend>Launch</legend>
      <select id="scene"><option>JettScene</option><option>FlapFortuneScene</option><option>ShatterStepScene</option></select>
      <select id="brand"><option value="jett-default">Default (approved)</option><option value="example-harbor-lights">Harbor Lights (fictional)</option><option value="example-orchid-club">Orchid Club (fictional)</option></select>
      <select id="entry"><option value="harness">dev harness</option><option value="release">release index.html</option></select>
      <button id="launch">Launch</button>
    </fieldset>
    <fieldset><legend>Commands → game</legend>
      <button data-cmd="pause">Pause</button><button data-cmd="resume">Resume</button>
      <button data-cmd="openSettings">Open settings</button><button data-cmd="closeSettings">Close settings</button>
      <button data-brand="example-harbor-lights">Brand: Harbor</button><button data-brand="example-orchid-club">Brand: Orchid</button><button data-brand="jett-default">Brand: Default</button>
    </fieldset>
    <fieldset><legend>Negative tests</legend>
      <button id="dup">Replay last (duplicate seq)</button><button id="bad">Malformed schema</button><button id="big">Oversized</button><button id="wild">Unknown command</button>
    </fieldset>
    <div id="log" role="log" aria-live="polite"></div>
  </aside>
  <main><iframe id="game" title="Game" allow="autoplay"></iframe></main>
  <script type="module" src="./host-main.ts"></script>
</body>
</html>
